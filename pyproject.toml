[project]
name = "frigate-exporter"
version = "1.0.6"
description = "Exports completed Frigate review events to a local folder."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "aiohttp>=3.14.1",
    "aiomqtt>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
